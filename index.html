<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SpORN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#081226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpORN">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Düzen: tek sütun, telefon ekranı; altta sekme çubuğu. Koyu tema (tek tema, bilerek). */
:root {
  --bg: #081226; --surface: #0f1d3a; --surface2: #172a4f; --line: #22375f;
  --fg: #ffffff; --muted: #93a4c3;
  --accent: #4f8dff; --accent-ink: #ffffff;
  --water: #7fd3ff; --good: #5fd39a; --bad: #ef7a6b;
  --f-display: 'Space Grotesk', 'Avenir Next', system-ui, sans-serif;
  --f-body: 'Inter', -apple-system, system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); touch-action: manipulation; }
* { touch-action: manipulation; }
.mc { touch-action: pan-y; }
body { margin: 0; font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
#app { max-width: 560px; margin: 0 auto; padding-block: 8px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; letter-spacing: -0.02em; }
h2 { font-size: 20px; }
h3 { font-size: 16px; font-weight: 500; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 10px; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.top { padding-top: 10px; display: grid; gap: 2px; }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sec { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
.sec .small { text-transform: none; letter-spacing: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.num { font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); }

.btn { font: 600 15px var(--f-body); border: 1px solid var(--line); background: var(--surface2); color: var(--fg); border-radius: 11px; padding: 11px 16px; cursor: pointer; }
.btn.sm { padding: 7px 12px; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ok { background: transparent; color: var(--good); border-color: var(--good); }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; padding: 15px; font-size: 16px; }
.btn:disabled { opacity: .35; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--accent); font: 600 14px var(--f-body); padding: 4px 0; cursor: pointer; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.pill-train { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.pill-ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill-off { background: color-mix(in srgb, var(--water) 18%, transparent); color: var(--water); }
.hint { font-size: 13.5px; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 9px; padding: 8px 10px; }

/* gün kartı */
.day { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 30%, var(--surface)) 0%, var(--surface) 65%); border-radius: 18px; padding: 16px; display: grid; gap: 10px; border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); }
.day.off { background: linear-gradient(160deg, color-mix(in srgb, var(--water) 14%, var(--surface)) 0%, var(--surface) 60%); border-color: color-mix(in srgb, var(--water) 25%, var(--line)); }
.day h2 { font-size: 24px; }
.day-top { display: flex; justify-content: space-between; align-items: center; }
.big { font-family: var(--f-display); font-size: 17px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; padding: 8px 4px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--water); }

/* su */
.water { grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.ring { --p: 0; width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--wc, var(--water)) calc(var(--p) * 360deg), var(--surface2) 0); transition: background .3s; position: relative; }
.ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.ring b { display: block; font: 700 19px var(--f-display); color: var(--fg); }
.wbody { display: grid; gap: 6px; min-width: 0; }

/* öğün zaman çizelgesi */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.meal { display: grid; grid-template-columns: 50px 1fr; gap: 10px; }
.tl { position: relative; padding-top: 14px; }
.tl::after { content: ""; position: absolute; left: 22px; top: 36px; bottom: -14px; width: 2px; background: var(--line); }
.meal:last-child .tl::after { display: none; }
.time { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; word-spacing: 50px; }
.meal.now .time { color: var(--accent); font-weight: 600; }
.mc { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; transition: transform .2s ease; border: 1px solid transparent; touch-action: pan-y; }
.meal.now .mc { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.meal.ate .mc h3 { color: var(--muted); }
.mh { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.sub { font-size: 13px; color: var(--muted); }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.swipe-ctl { display: flex; gap: 6px; }
.tick { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: #06210f; font-weight: 700; cursor: pointer; }
.tick.on { background: var(--good); border-color: var(--good); }
.recipe { border-top: 1px solid var(--line); padding-top: 4px; display: grid; gap: 4px; }
.recipe ul, .recipe ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.tip { font-style: italic; color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.supps { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--f-body); background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 6px 11px; cursor: pointer; }
.chip.on { background: color-mix(in srgb, var(--good) 18%, transparent); border-color: var(--good); color: var(--good); }
.rules summary { font-weight: 600; cursor: pointer; }
.rules ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; color: var(--muted); }

/* antrenman */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); padding: 4px; border-radius: 12px; }
.seg button { font: 600 13.5px var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 9px 4px; border-radius: 9px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface2); color: var(--fg); }
.notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 2px; }
.simple { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--r); }
.simple li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.simple li:last-child { border-bottom: 0; }
.simple.hist li { grid-template-columns: 70px 1fr auto; }
.vid { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
.vid.big { border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); padding: 6px 10px; border-radius: 9px; white-space: nowrap; }
.exlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ex { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.ex.ss { border-left: 3px solid var(--accent); }
.ss-head { font-size: 12.5px; color: var(--accent); font-weight: 600; padding: 4px 2px 0; }
.exh { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.target { font: 700 15px var(--f-display); color: var(--accent); }
.note { font-size: 13.5px; color: var(--muted); }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 22px 1fr 26px 1fr 30px; gap: 6px; align-items: center; }
.sn { font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.u { font-size: 12px; color: var(--muted); }
input { font: 500 16px var(--f-body); background: var(--surface2); border: 1px solid var(--line); color: var(--fg); border-radius: 9px; padding: 9px 10px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
input::placeholder { color: #5a6d92; }
.cardio .big { color: var(--fg); }
.finish { display: grid; gap: 8px; justify-items: start; }
.finish .wide { justify-self: stretch; }
.okmsg { color: var(--good); font-weight: 600; }

/* kilo */
.stats { grid-template-columns: repeat(3, 1fr); text-align: left; }
.stats > div { display: grid; gap: 2px; }
.stats .num { font: 700 26px var(--f-display); }
.wform label { font-weight: 600; }
.wform .row { flex-wrap: nowrap; }
.wform input { flex: 1; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.chart .dot { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.x { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
textarea { width: 100%; background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 8px; font: 12px ui-monospace, monospace; }
.backup h3 { font-size: 15px; }

/* günlük görev barı + çizgi adam */
.prog { grid-template-columns: 72px 1fr; align-items: center; gap: 14px; }
.stick { width: 72px; height: 116px; overflow: visible; }
.stick .limbs { fill: none; stroke: var(--fg); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.stick .headring { fill: none; stroke: var(--fg); stroke-width: 2; }
.stick.lv4 .fig { animation: hop 1.1s ease-in-out infinite; transform-origin: 30px 90px; }
.stick.lv0 .fig { transform: rotate(4deg); transform-origin: 30px 92px; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
.pbody { display: grid; gap: 6px; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: baseline; }
.pnum { font: 700 28px var(--f-display); font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2f6bea, var(--accent) 60%, #a9c8ff); transition: width .4s ease; }
.bar { position: relative; }
.bar i { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bg); opacity: .7; }
.barwrap { display: grid; gap: 3px; }
.marks { position: relative; height: 14px; }
.marks b { position: absolute; transform: translateX(-50%); font: 600 10.5px var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.marks b:last-child { transform: translateX(-100%); }
.marks b.hit { color: var(--accent); }
.pparts { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* alt sekmeler */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tab { background: none; border: 0; color: var(--muted); font: 600 12px var(--f-body); display: grid; justify-items: center; gap: 3px; padding: 6px; cursor: pointer; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Bölümler">
  <button class="tab" data-v="bugun"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Bugün</button>
  <button class="tab" data-v="antrenman"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Spor</button>
  <button class="tab" data-v="kilo"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-8"/><path d="M15 7h5v5"/></svg>Kilo</button>
</nav>
<script src="data.js?v=9"></script>
<script src="app.js?v=9"></script>
<script>
document.addEventListener('gesturestart', e => e.preventDefault());
if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai') && !location.hostname.includes('claudeusercontent')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
</body>
</html>
